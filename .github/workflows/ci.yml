name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APKRUN_CI: "1"

jobs:
  lint:
    name: lint
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Run repository checks
        run: scripts/ci/run-checks.sh

  codegen:
    name: codegen
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Check generated files
        run: scripts/ci/codegen.sh

  third-party:
    name: third-party
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Build pinned graphics libraries
        run: scripts/build-third-party.sh virgl-runtime
      - name: Verify shipped source license copies
        run: scripts/release/generate-notices.py --check

  build:
    name: build
    needs: third-party
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare result directories
        run: mkdir -p build/ci
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Verify graphics libraries
        run: scripts/build-third-party.sh virgl-runtime
      - name: Check build environment
        run: scripts/bootstrap --check
      - name: Generate Xcode project
        run: scripts/generate-project.sh
      - name: Build Swift package
        run: swift build -j 2
      - name: Build embedded runtime CLI
        run: swift build -j 2 --traits EmbeddedRuntime
      - name: Build Debug products
        run: >-
          xcodebuild -project APKRun.xcodeproj -scheme APKRun
          -configuration Debug -jobs 2 -derivedDataPath build/DebugDerivedData
          -resultBundlePath build/ci/APKRun-Debug.xcresult
          CODE_SIGN_IDENTITY=- build
      - name: Free disk before Release build
        run: rm -rf build/DebugDerivedData
      - name: Build Release products
        run: >-
          xcodebuild -project APKRun.xcodeproj -scheme APKRun
          -configuration Release -jobs 2 -derivedDataPath build/ReleaseDerivedData
          -resultBundlePath build/ci/APKRun-Release.xcresult
          CODE_SIGNING_ALLOWED=NO build
      - name: Check Release bundle
        run: scripts/release/check-release-build.sh build/ReleaseDerivedData/Build/Products/Release/APKRun.app
      - name: Upload build results on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-results
          path: build/ci/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  test-swift:
    name: test-swift
    needs: third-party
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare result directory
        run: mkdir -p build/ci
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Verify graphics libraries and public headers
        run: scripts/build-third-party.sh virgl-runtime
      - name: Run Swift T0 tests
        run: swift test --skip 'SystemTests' -j 2 --xunit-output build/ci/swift-tests.xml
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: swift-test-results
          path: |
            build/ci/*.xcresult
            build/ci/*.xml
          if-no-files-found: warn
          retention-days: 14

  test-graphics:
    name: test-graphics
    needs: third-party
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Verify graphics libraries and public headers
        run: scripts/build-third-party.sh virgl-runtime
      - name: Require a Metal-capable runner
        run: >-
          swift -e 'import Metal; guard MTLCreateSystemDefaultDevice() != nil
          else { fatalError("runnerMissingMetal") }'
      - name: Run Metal and VirGL T1 tests
        run: swift test --filter GraphicsCoreSystemTests -j 2
      - name: Run Metal and VirGL T1 tests with Address Sanitizer
        run: swift test --sanitize=address --filter GraphicsCoreSystemTests -j 2
      - name: Run Metal and VirGL T1 tests with Undefined Behavior Sanitizer
        run: swift test --sanitize=undefined --filter GraphicsCoreSystemTests -j 2

  test-images:
    name: test-images
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Python 3.12
        run: brew install python@3.12
      - name: Install image tooling
        run: |
          python3.12 -m venv Images/tools/.venv
          Images/tools/.venv/bin/python -m pip install -e 'Images/tools[test]'
      - name: Run image tooling tests
        run: Images/tools/.venv/bin/python -m pytest Images/tools/tests
      - name: Check image tooling style
        run: |
          Images/tools/.venv/bin/ruff check Images/tools
          Images/tools/.venv/bin/ruff format --check Images/tools
