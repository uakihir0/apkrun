{
  "schemaVersion": 1,
  "substitutions": [
    {
      "pattern": "(?i)(\\b(?:androidboot\\.|ro\\.)?serial(?:_?number|no)?\\b[\\\"']?\\s*\\]?\\s*[=:]\\s*[\\\"']?\\[?)([^\\]\\s,;\\\"']+)",
      "replacement": "\\1<SERIAL>"
    },
    {
      "pattern": "\\b(?:[0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}\\b",
      "replacement": "<MAC>"
    },
    {
      "pattern": "(?<![A-Za-z0-9_])(?:/home|/Users)/[^\\s,;\\\"'<>\\]\\)]+",
