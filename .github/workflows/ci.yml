name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APKRUN_CI: "1"

jobs:
  lint:
    name: lint
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Run repository checks
        run: scripts/ci/run-checks.sh

  test-vsockd:
    name: test-vsockd
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --component clippy --component rustfmt --target aarch64-linux-android
      - name: Run Rust tests and checks
        working-directory: Guest/vsockd
        run: |
          cargo test --locked
          cargo test --locked --features vsock-loopback --no-run
          cargo clippy --locked --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks -D clippy::unwrap_used
          cargo clippy --locked --features vsock-loopback --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks -D clippy::unwrap_used
          cargo clippy --locked --target aarch64-linux-android --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks -D clippy::unwrap_used
          cargo fmt --all --check
      - name: Run AF_VSOCK loopback test when supported
        working-directory: Guest/vsockd
        shell: bash
        run: |
          if [[ -d /sys/module/vsock_loopback ]] || sudo modprobe vsock_loopback; then
            cargo test --locked --features vsock-loopback -- --ignored vsock_loopback
          else
            echo "::notice::The runner kernel does not provide vsock_loopback; run the documented T1 command on a Linux host with AF_VSOCK loopback support."
          fi

  codegen:
    name: codegen
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Check generated files
        run: scripts/ci/codegen.sh

  third-party:
    name: third-party
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Build pinned graphics libraries
        run: scripts/build-third-party.sh virgl-runtime
      - name: Verify shipped source license copies
        run: scripts/release/generate-notices.py --check

  build:
    name: build
    needs: third-party
    runs-on: xcode-27
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare result directories
        run: mkdir -p build/ci
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Verify graphics libraries
        run: scripts/build-third-party.sh virgl-runtime
      - name: Check build environment
        run: scripts/bootstrap --check
      - name: Generate Xcode project
        run: scripts/generate-project.sh
      - name: Build Swift package
        run: scripts/ci/run-logged.sh build/ci/swift-build.log swift build -j 2
      - name: Build embedded runtime CLI
        run: scripts/ci/run-logged.sh build/ci/swift-build-embedded.log swift build -j 2 --traits EmbeddedRuntime
      - name: Build Guest Agent
        run: |
          if [ ! -x "$ANDROID_HOME/build-tools/37.0.0/apksigner" ]; then
            sdkmanager "build-tools;37.0.0" >/dev/null
          fi
          scripts/ci/run-logged.sh build/ci/build-guest.log scripts/build-guest.sh
      - name: Build Debug products
        run: >-
          scripts/ci/run-logged.sh build/ci/xcodebuild-debug.log
          xcodebuild -project APKRun.xcodeproj -scheme APKRun
          -configuration Debug -jobs 2 -derivedDataPath build/DebugDerivedData
          -resultBundlePath build/ci/APKRun-Debug.xcresult
          CODE_SIGN_IDENTITY=- build
      - name: Free disk before Release build
        run: rm -rf build/DebugDerivedData
      - name: Build Release products
        run: >-
          APKRUN_GUEST_EMBED=off
          scripts/ci/run-logged.sh build/ci/xcodebuild-release.log
          xcodebuild -project APKRun.xcodeproj -scheme APKRun
          -configuration Release -jobs 2 -derivedDataPath build/ReleaseDerivedData
          -resultBundlePath build/ci/APKRun-Release.xcresult
          CODE_SIGNING_ALLOWED=NO build
      - name: Check Release bundle
        run: scripts/release/check-release-build.sh build/ReleaseDerivedData/Build/Products/Release/APKRun.app
      - name: Upload build results on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: build-results
          path: build/ci/*.xcresult
          if-no-files-found: warn
          retention-days: 14

  test-swift:
    name: test-swift
    needs: third-party
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare result directory
        run: mkdir -p build/ci
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Verify graphics libraries and public headers
        run: scripts/build-third-party.sh virgl-runtime
      - name: Run Swift T0 tests
        run: |
          mkdir -p build/ci
          set +e
          swift test --skip 'SystemTests' -j 2 \
            --experimental-maximum-parallelization-width 2 \
            --xunit-output build/ci/swift-tests.xml 2>&1 | tee build/ci/swift-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            # Job logs need a signed-in viewer even for public repositories;
            # echo the failures into the public annotations instead.
            grep -E "✘|error:" build/ci/swift-tests.log | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: swift-test-results
          path: |
            build/ci/*.xcresult
            build/ci/*.xml
          if-no-files-found: warn
          retention-days: 14

  test-graphics:
    name: test-graphics
    needs: third-party
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: third-party-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ThirdParty/out/virgl-runtime/${{ steps.third-party-key.outputs.key }}
          key: ${{ runner.os }}-virgl-runtime-${{ steps.third-party-key.outputs.key }}
      - name: Verify graphics libraries and public headers
        run: scripts/build-third-party.sh virgl-runtime
      - name: Require a Metal-capable runner
        run: >-
          swift -e 'import Metal; guard MTLCreateSystemDefaultDevice() != nil
          else { fatalError("runnerMissingMetal") }'
      - name: Run Metal and VirGL T1 tests
        run: |
          set +e
          swift test --filter GraphicsCoreSystemTests -j 2 2>&1 | tee build/ci/graphics-tests.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            grep -E "✘|error:" build/ci/graphics-tests.log | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi
      - name: Run Metal and VirGL T1 tests with Address Sanitizer
        run: |
          set +e
          swift test --sanitize=address --filter GraphicsCoreSystemTests -j 2 2>&1 | tee build/ci/graphics-tests-asan.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            grep -E "✘|error:" build/ci/graphics-tests-asan.log | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi
      - name: Run Metal and VirGL T1 tests with Undefined Behavior Sanitizer
        run: |
          set +e
          swift test --sanitize=undefined --filter GraphicsCoreSystemTests -j 2 2>&1 | tee build/ci/graphics-tests-ubsan.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            grep -E "✘|error:" build/ci/graphics-tests-ubsan.log | head -40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              printf '::error::%s\n' "$line"
            done
            exit "$status"
          fi

  test-images:
    name: test-images
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install Python 3.12
        run: brew install python@3.12
      - name: Install image tooling
        run: |
          python3.12 -m venv Images/tools/.venv
          Images/tools/.venv/bin/python -m pip install -e 'Images/tools[test]'
      - name: Check committed Android image manifests
        run: |
          for manifest in Images/manifests/*/android-image.json; do
            if [ -f "$manifest" ]; then
              Images/tools/.venv/bin/python -m apkrun_image manifest --check --no-files "$manifest"
            fi
          done
      - name: Run image tooling tests
        run: Images/tools/.venv/bin/python -m pytest Images/tools/tests
      - name: Check image tooling style
        run: |
          Images/tools/.venv/bin/ruff check Images/tools
          Images/tools/.venv/bin/ruff format --check Images/tools

  fuzz-short:
    name: fuzz-short (changed targets, 60s)
    if: github.event_name == 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Cache pinned repository tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            build/tools
            Images/tools/.venv
          key: pinned-tools-v1-${{ hashFiles('scripts/tool-versions.env') }}
      - name: Install pinned repository tools
        # Anonymous GitHub fetches from shared runners are rate-limited (401);
        # authenticate every git fetch with the run's token, scoped to this
        # step so build and test code never sees it.
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://x-access-token:${{ github.token }}@github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "https://github.com/"
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/bootstrap
      - name: Compute verified build cache key
        id: cache-key
        run: echo "key=$(scripts/build-third-party.sh --print-cache-key virgl-runtime)" >> "$GITHUB_OUTPUT"
      - name: Restore verified graphics libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ThirdParty/out
          key: ${{ steps.cache-key.outputs.key }}
      - name: Build pinned graphics libraries
        run: scripts/build-third-party.sh virgl-runtime
      - name: Install the pinned fuzz toolchain
        run: |
          source scripts/tool-versions.env
          toolchain_dir="$HOME/Library/Developer/Toolchains"
          mkdir -p "$toolchain_dir"
          if ! compgen -G "$toolchain_dir/${SWIFT_FUZZ_TOOLCHAIN}*.xctoolchain" > /dev/null; then
            # SWIFT_FUZZ_TOOLCHAIN is e.g. swift-6.2.3; swift.org publishes
            # https://download.swift.org/<tag>/xcode/<PKG>/<PKG>-osx.pkg.
            tag="$(printf '%s' "$SWIFT_FUZZ_TOOLCHAIN" | tr '[:upper:]' '[:lower:]')-release"
            pkg="${SWIFT_FUZZ_TOOLCHAIN}-RELEASE"
            curl -fsSL -o /tmp/swift.pkg "https://download.swift.org/${tag}/xcode/${pkg}/${pkg}-osx.pkg"
            sudo installer -pkg /tmp/swift.pkg -target /
          fi
      - name: Fuzz the changed parsers
        run: scripts/run-fuzz.sh --changed --seconds 60
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-artifacts-${{ github.event.pull_request.number }}
          path: build/fuzz/
          if-no-files-found: warn
          retention-days: 30
