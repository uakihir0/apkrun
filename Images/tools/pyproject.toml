[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "apkrun-image-tools"
version = "0.1.0"
description = "Build-time tooling for APKRun Android images"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography==50.0.1",
  "jsonschema==4.26.0",
  "lz4==4.4.5",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apkrun_image*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["**/vendor/**"]

[tool.ruff.lint]
select = ["ANN", "E", "F", "I", "UP"]
