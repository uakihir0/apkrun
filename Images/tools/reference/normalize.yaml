      "replacement": "<HOST_PATH>",
      "files": [
        "crosvm-command-line.txt",
        "cuttlefish_config.json",
        "composite-disk-specs.json",
        "kernel.log",
        "launcher.log",
        "launch-cvd-console.log",
        "host.json"
