name: Nightly acceptance gates

# Manual dispatch only: no apkrun-reference or apkrun-lab runner is registered
# (IR-295), so a scheduled run could only stay queued (IR-314). Restore the
# daily schedule (cron "15 3 * * *") once the lab runners exist.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-gates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    name: gates
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - apkrun-reference
    timeout-minutes: 45
    env:
      APKRUN_CI: "1"
      APKRUN_TEST_DEVELOPMENT_TEAM: ${{ vars.APKRUN_TEST_DEVELOPMENT_TEAM }}
      APKRUN_TEST_CODE_SIGN_IDENTITY: ${{ vars.APKRUN_TEST_CODE_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check test signing configuration
        run: |
          if [[ -z "$APKRUN_TEST_DEVELOPMENT_TEAM" || -z "$APKRUN_TEST_CODE_SIGN_IDENTITY" ]]; then
            printf 'Set APKRUN_TEST_DEVELOPMENT_TEAM and APKRUN_TEST_CODE_SIGN_IDENTITY repository variables for the lab Apple Development certificate.\n' >&2
            exit 1
          fi
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Run closed acceptance gates
        run: scripts/run-gate.sh G1
      - name: Upload G1 evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gate-G1-${{ github.sha }}
          path: build/gates/G1
          if-no-files-found: warn
          retention-days: 30

  network:
    name: network (external reachability)
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - apkrun-lab
    timeout-minutes: 30
    env:
      APKRUN_CI: "1"
      APKRUN_TEST_DEVELOPMENT_TEAM: ${{ vars.APKRUN_TEST_DEVELOPMENT_TEAM }}
      APKRUN_TEST_CODE_SIGN_IDENTITY: ${{ vars.APKRUN_TEST_CODE_SIGN_IDENTITY }}
    steps:
      - name: Select the test Linux directory
        run: echo "APKRUN_TEST_LINUX_DIR=$RUNNER_TEMP/apkrun-test-linux" >> "$GITHUB_ENV"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check test signing configuration
        run: |
          if [[ -z "$APKRUN_TEST_DEVELOPMENT_TEAM" || -z "$APKRUN_TEST_CODE_SIGN_IDENTITY" ]]; then
            printf 'Set APKRUN_TEST_DEVELOPMENT_TEAM and APKRUN_TEST_CODE_SIGN_IDENTITY repository variables for the lab Apple Development certificate.\n' >&2
            exit 1
          fi
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Generate Xcode project
        run: scripts/generate-project.sh
      - name: Build Linux test guest
        run: scripts/build-test-initramfs.sh
      - name: Prepare network test results
        run: |
          rm -rf build/nightly/network/Network.xcresult
          mkdir -p build/nightly/network
      - name: Run external network acceptance check
        run: >-
          xcodebuild test
          -project APKRun.xcodeproj
          -scheme AcceptanceTests
          -testPlan AcceptanceTests
          -only-test-configuration Network
          -only-testing:AcceptanceTests/LinuxGuestNetworkAcceptanceTests
          -jobs 1
          -derivedDataPath build/nightly/network/DerivedData
          -resultBundlePath build/nightly/network/Network.xcresult
          "APKRUN_TEST_LINUX_DIR=$APKRUN_TEST_LINUX_DIR"
          "APKRUN_CI=$APKRUN_CI"
          "DEVELOPMENT_TEAM=$APKRUN_TEST_DEVELOPMENT_TEAM"
          CODE_SIGN_STYLE=Manual
          "CODE_SIGN_IDENTITY=$APKRUN_TEST_CODE_SIGN_IDENTITY"
      - name: Upload network test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: network-${{ github.sha }}
          path: build/nightly/network/Network.xcresult
          if-no-files-found: warn
          retention-days: 30

  compatibility:
    name: compatibility (F-Droid corpus)
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - apkrun-lab
    timeout-minutes: 60
    env:
      APKRUN_CI: "1"
      ANDROID_HOME: ${{ vars.ANDROID_HOME }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Verify corpus signer digests against apksigner
        run: scripts/dev/verify-corpus.sh
      - name: Run the compatibility corpus
        run: Tests/Compatibility/run-compatibility.sh
      - name: Upload corpus evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: corpus-${{ github.sha }}
          path: |
            build/corpus/
            Tests/Compatibility/out/
          if-no-files-found: warn
          retention-days: 30

  notarize:
    name: notarize (distribution wrapper)
    if: github.ref == 'refs/heads/main'
    runs-on:
      - self-hosted
      - macOS
      - apkrun-lab
    timeout-minutes: 30
    environment: signing
    env:
      APKRUN_CI: "1"
      APKRUN_DEVELOPER_ID: ${{ vars.APKRUN_DEVELOPER_ID }}
      APKRUN_NOTARY_KEY_ID: ${{ secrets.APKRUN_NOTARY_KEY_ID }}
      APKRUN_NOTARY_ISSUER: ${{ secrets.APKRUN_NOTARY_ISSUER }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Store the notarization API key
        env:
          APKRUN_NOTARY_KEY_P8: ${{ secrets.APKRUN_NOTARY_KEY_P8 }}
        run: |
          mkdir -p build/notary
          echo "$APKRUN_NOTARY_KEY_P8" | base64 -d > build/notary/key.p8
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Notarize and staple the Release build smoke check
        run: |
          # Exercises notarize.sh end to end on the lab Mac; the full
          # distribution-wrapper path needs a real package and is covered
          # by the T1 signing fixtures.
          scripts/generate-project.sh
          app="$(scripts/release/assemble-bundle.sh \
              --build 0 --derived-data build/nightly/notarize/DerivedData \
              --developer-id "$APKRUN_DEVELOPER_ID" | tail -1)"
          scripts/release/notarize.sh "$app" \
              --key build/notary/key.p8 \
              --key-id "$APKRUN_NOTARY_KEY_ID" \
              --issuer "$APKRUN_NOTARY_ISSUER"

  fuzz-long:
    name: fuzz-long (all targets, 1h)
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Restore verified graphics libraries
        uses: actions/cache@0400d5f644dc74513175e3b8b85b7f6cf5f0f400 # v4
        with:
          path: ThirdParty/out
          key: apkrun-third-party-${{ runner.os }}-${{ hashFiles('ThirdParty/ThirdParty.lock.json') }}
      - name: Install the pinned fuzz toolchain
        run: |
          source scripts/tool-versions.env
          toolchain_dir="$HOME/Library/Developer/Toolchains"
          mkdir -p "$toolchain_dir"
          if ! compgen -G "$toolchain_dir/${SWIFT_FUZZ_TOOLCHAIN}*.xctoolchain" > /dev/null; then
            tag="$(python3 -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("https://www.swift.org/api/v1/install/releases.json"))["releases"][-1]["tag"])')"
            pkg="swift-${tag#swift-}-osx.pkg"
            curl -fsSL -o /tmp/swift.pkg "https://download.swift.org/${tag#swift-}/xcode/$pkg"
            sudo installer -pkg /tmp/swift.pkg -target /
          fi
      - name: Restore the growing corpus
        uses: actions/cache@0400d5f644dc74513175e3b8b85b7f6cf5f0f400 # v4
        with:
          path: Tests/Fixtures/fuzz/
          key: apkrun-fuzz-corpus-${{ github.ref_name }}
          restore-keys: apkrun-fuzz-corpus-
      - name: Fuzz every parser
        run: |
          for target in virtio-gpu-request resource-table guest-frame-swift container-reader apk-signing-block aapt2-badging direct-manifest fdroid-index github-releases; do
            scripts/run-fuzz.sh "$target" --seconds 400
            # Merge new coverage into the seed corpus so it grows nightly.
            for seed in build/fuzz/$target/*; do
              cp "$seed" "Tests/Fixtures/fuzz/$target/" 2>/dev/null || true
            done
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: fuzz-artifacts-nightly-${{ github.sha }}
          path: build/fuzz/
          if-no-files-found: warn
          retention-days: 30
