      "replacement": "\\1<REDACTED>\\2"
    },
    {
      "pattern": "(?i)([\\\"']?\\[?[A-Za-z0-9_.-]*(?:password|passwd|token|secret|api[_-]?key|private[_-]?key)[A-Za-z0-9_.-]*\\]?[\\\"']?\\s*[=:]\\s*')(?:(?:\\\\.)|[^'\\\\])*(')",
      "replacement": "\\1<REDACTED>\\2"
    },
    {
      "pattern": "(?i)([\\\"']?\\[?[A-Za-z0-9_.-]*(?:password|passwd|token|secret|api[_-]?key|private[_-]?key)[A-Za-z0-9_.-]*\\]?[\\\"']?\\s*[=:]\\s*\\[?)([^\\]\\s,;\\\"']+)",
      "replacement": "\\1<REDACTED>"
    },
    {
      "pattern": "(?s)-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----.*?-----END [A-Z0-9 ]*PRIVATE KEY-----",
      "replacement": "<REDACTED_PRIVATE_KEY>"
    }
  ]
}
