name: Weekly clean third-party build

on:
  schedule:
    - cron: "23 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-third-party:
    name: clean-third-party
    if: github.ref == 'refs/heads/main'
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned repository tools
        run: scripts/bootstrap
      - name: Remove third-party outputs
        run: rm -rf ThirdParty/out
      - name: Build from locked sources without a cache
        run: scripts/build-third-party.sh virgl-runtime
