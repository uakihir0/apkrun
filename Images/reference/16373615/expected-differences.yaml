  },
  {
    "category": "bootconfig",
    "key": "androidboot.lcd_density",
    "reason": "density 320 for the headless profile's 720x1280 display (BootOptions default); the reference's display was 280",
    "design": "android-image.md §9.1"
  },
  {
    "category": "bootconfig",
    "key": "androidboot.auto_eth_guest_addr",
    "reason": "automotive-only key for a host-side client; omitted (CF-13, §7.3)",
    "design": "android-image.md §7.3"
  },
  {
    "category": "bootconfig",
    "key": "androidboot.vhal_proxy_server_port",
    "reason": "host-side vHAL proxy; omitted (CF-13, §7.3)",
    "design": "android-image.md §7.3"
  },
  {
    "category": "bootconfig",
    "key": "androidboot.vsock_tombstone_port",
    "reason": "host-side tombstone transmit; omitted (CF-13, §7.3)",
    "design": "android-image.md §7.3"
  },
  {
    "category": "cmdline",
    "key": "panic#2",
    "reason": "the launcher's command line repeats panic=-1; cmdline.txt passes it once (§6.4)",
    "design": "android-image.md §6.4"
  },
  {
    "category": "cmdline",
    "key": "earlycon",
    "reason": "crosvm's 8250 UART at 0x3f8; VZ has no such UART, so no early console is passed (§6.4)",
    "design": "android-image.md §6.4"
  },
  {
    "category": "cmdline",
    "key": "ramoops.mem_address",
    "reason": "crosvm's ramoops buffer; VZ has no ramoops region (§6.4, CF-19)",
    "design": "android-image.md §6.4"
  },
  {
    "category": "cmdline",
    "key": "ramoops.mem_size",
    "reason": "crosvm's ramoops buffer size; VZ has no ramoops region (§6.4, CF-19)",
    "design": "android-image.md §6.4"
  },
  {
    "category": "cmdline",
    "key": "log_buf_len",
    "reason": "APKRun addition: a 2 MiB kernel log buffer for the boot's first lines (CF-18, §6.6)",
    "design": "android-image.md §6.6"
  }
]
